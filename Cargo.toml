[package]
name = "ojrs"
version = "0.1.0"
edition = "2021"
authors = ["Manybugs"]
description = "Online Judge Tools in Rust"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
colored = "2.1"
regex = "1.10"
